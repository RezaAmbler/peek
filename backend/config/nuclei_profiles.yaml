# Nuclei Service Profile Configuration
# =====================================
#
# Maps Nmap service detection to Nuclei scanning configuration.
#
# HOW TO ADD NEW SERVICES:
# 1. Check if nuclei has templates: nuclei -tl -tags <service_name>
# 2. If templates exist, add entry below
# 3. Network services use: target_format: host_port, tags: [<service>]
# 4. HTTP-based services use: target_format: url, protocol: http/https
# NOTE: Avoid broad tags like 'network' - they add 300+ templates and cause timeouts
#
# TEMPLATE TAG DISCOVERY:
#   docker exec peek-celery-1 nuclei -tl -tags <tag_name>
#
# Common nuclei tags: ssh, ftp, mysql, redis, mongodb, smtp, dns,
#                     rdp, vnc, ldap, network, default-login, cve

# ============================================
# Template Exclusions
# ============================================
# Templates to exclude from all scans
# These are typically noisy, slow, or produce false positives
# NOTE: Avoid broad exclusions like http/miscellaneous/ - it blocks robots-txt and other useful findings
excluded_templates:
  - http/miscellaneous/external-service-interaction.yaml  # Noisy, low value
  - http/technologies/fingerprinthub-web-fingerprints.yaml

# ============================================
# Scan Mode Configurations
# ============================================
# fast = targeted tags for HTTP (focuses on real vulnerabilities)
# deep = comprehensive CVE and vulnerability scan (prevents timeout issues)
# NOTE: Empty tags [] causes timeouts on HTTP services (>5000 templates)
scan_modes:
  fast:
    # Use 'cve' (singular) to match nuclei template tags
    http_tags: [cve, vulnerabilities, exposures]
    description: "Fast scan - focuses on known CVEs and common vulnerabilities"
  deep:
    # Use 'cve' (singular) to match nuclei template tags
    http_tags: [cve, vulnerabilities, exposures, misconfigurations, default-login, config, unauth, injection, rce, lfi, sqli, xss, ssrf, idor, panel]
    description: "Deep scan - comprehensive CVE and vulnerability detection without timeout"

# ============================================
# Technology Tags (from httpx detection)
# ============================================
# Maps httpx technology fingerprints to nuclei tags.
# These enhance base service profiles with more specific templates.
# When httpx detects a technology, the corresponding tags are ADDED
