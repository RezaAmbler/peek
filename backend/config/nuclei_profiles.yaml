# Nuclei Service Profile Configuration
# =====================================
#
# Maps Nmap service detection to Nuclei scanning configuration.
#
# HOW TO ADD NEW SERVICES:
# 1. Check if nuclei has templates: nuclei -tl -tags <service_name>
# 2. If templates exist, add entry below
# 3. Most network services use: target_format: host_port, tags: [<service>, network]
# 4. HTTP-based services use: target_format: url, protocol: http/https
#
# TEMPLATE TAG DISCOVERY:
#   docker exec peek-celery-1 nuclei -tl -tags <tag_name>
#
# Common nuclei tags: ssh, ftp, mysql, redis, mongodb, smtp, dns,
#                     rdp, vnc, ldap, network, default-login, cve

# ============================================
# Template Exclusions
# ============================================
# Templates to exclude from all scans
# These are typically noisy, slow, or produce false positives
excluded_templates:
  - http/miscellaneous/
  - http/technologies/fingerprinthub-web-fingerprints.yaml

# ============================================
# Scan Mode Configurations
# ============================================
# fast = targeted tags for HTTP (focuses on real vulnerabilities)
# deep = comprehensive scan (empty tags for HTTP = all templates)
scan_modes:
  fast:
    http_tags: [cves, vulnerabilities, exposures, misconfigurations]
    description: "Fast scan - focuses on known CVEs and common vulnerabilities"
  deep:
    http_tags: []
    description: "Deep scan - runs all applicable templates"

# ============================================
# Port-Based Fallback Hints
# ============================================
# Used when nmap service detection fails but port is well-known
port_hints:
  21: ftp
  22: ssh
  23: telnet
  25: smtp
  53: dns
  80: http
  110: pop3
  143: imap
  443: ssl/http
  445: smb
  993: ssl/imap
  995: ssl/pop3
  1433: ms-sql-s
  1521: oracle
  3306: mysql
  3389: rdp
  5432: postgresql
  5672: amqp
  5900: vnc
  6379: redis
  8080: http
  8443: ssl/http
  9200: elasticsearch
  11211: memcached
  27017: mongodb

# ============================================
# Service Profiles
# ============================================
#
# target_format: 'url' (http://ip:port) or 'host_port' (ip:port)
# protocol: 'http', 'https', or null (for non-HTTP)
# tags: List of nuclei template tags to use
# timeout_multiplier: Adjust scan timeout (1.0 = default)

service_profiles:
  # --- HTTP Services (require URL format) ---
  # NOTE: Empty tags [] means run ALL templates (comprehensive scan)
  # Nuclei will use -severity filtering only, no tag filtering
  http:
    target_format: url
    protocol: http
    tags: []  # Comprehensive - all templates

  https:
    target_format: url
    protocol: https
    tags: []  # Comprehensive - all templates

  http-proxy:
    target_format: url
    protocol: http
    tags: []  # Comprehensive - all templates

  http-alt:
    target_format: url
    protocol: http
    tags: []  # Comprehensive - all templates

  ssl/http:
    target_format: url
    protocol: https
    tags: []  # Comprehensive - all templates

  # --- Network Services (use host:port format) ---
  # These all follow the same pattern: tags match service name + 'network'

  ssh:
    target_format: host_port
    tags: [ssh, network]
    timeout_multiplier: 0.5

  ftp:
    target_format: host_port
    tags: [ftp, network]
    timeout_multiplier: 0.5

  mysql:
    target_format: host_port
    tags: [mysql, network]
    timeout_multiplier: 0.5
    rate_limit: 50  # Slower for databases

  postgresql:
    target_format: host_port
    tags: [postgres, network]
    timeout_multiplier: 0.5
    rate_limit: 50  # Slower for databases

  redis:
    target_format: host_port
    tags: [redis, network]
    timeout_multiplier: 0.5
    rate_limit: 50  # Slower for databases

  mongodb:
    target_format: host_port
    tags: [mongodb, network]
    timeout_multiplier: 0.5
    rate_limit: 50  # Slower for databases

  smtp:
    target_format: host_port
    tags: [smtp, network]
    timeout_multiplier: 0.5

  rdp:
    target_format: host_port
    tags: [rdp, network]
    timeout_multiplier: 0.5

  ms-wbt-server:  # RDP alternate name
    target_format: host_port
    tags: [rdp, network]
    timeout_multiplier: 0.5

  vnc:
    target_format: host_port
    tags: [vnc, network]
    timeout_multiplier: 0.5

  telnet:
    target_format: host_port
    tags: [telnet, network]
    timeout_multiplier: 0.5

  ldap:
    target_format: host_port
    tags: [ldap, network]
    timeout_multiplier: 0.5
    rate_limit: 50  # Slower for sensitive services

  dns:
    target_format: host_port
    tags: [dns, network]
    timeout_multiplier: 0.5

  domain:  # DNS alternate name
    target_format: host_port
    tags: [dns, network]
    timeout_multiplier: 0.5

  # --- IoT / Embedded Protocols ---
  upnp:
    target_format: host_port
    tags: [upnp, network, iot]
    timeout_multiplier: 0.5

  rtsp:
    target_format: host_port
    tags: [rtsp, network]
    timeout_multiplier: 0.5

  sip:
    target_format: host_port
    tags: [sip, network, voip]
    timeout_multiplier: 0.5

  mqtt:
    target_format: host_port
    tags: [mqtt, network, iot]
    timeout_multiplier: 0.5

  coap:
    target_format: host_port
    tags: [coap, network, iot]
    timeout_multiplier: 0.5

  modbus:
    target_format: host_port
    tags: [modbus, network, iot, ics]
    timeout_multiplier: 0.5

  bacnet:
    target_format: host_port
    tags: [bacnet, network, iot, ics]
    timeout_multiplier: 0.5

# ============================================
# Fallback for Unknown Services
# ============================================
# If a service isn't listed above, the mapper will:
# 1. Try using service_name as a nuclei tag
# 2. Add 'network' tag
# 3. Use host:port format
# Set to false to skip unknown services entirely
scan_unknown_services: true

