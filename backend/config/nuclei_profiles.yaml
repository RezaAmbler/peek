# ============================================
# Port-Based Fallback Hints
# ============================================
# Used when nmap service detection fails but port is well-known
port_hints:
  21: ftp
  22: ssh
  23: telnet
  25: smtp
  53: dns
  80: http
  110: pop3
  143: imap
  443: ssl/http
  445: smb
  993: ssl/imap
  995: ssl/pop3
  1433: ms-sql-s
  1521: oracle
  3306: mysql
  3389: rdp
  5432: postgresql
  5672: amqp
  5900: vnc
  6379: redis
  8080: http
  8443: ssl/http
  9200: elasticsearch
  11211: memcached
  27017: mongodb

# ============================================
# Service Profiles
# ============================================
#
# target_format: 'url' (http://ip:port) or 'host_port' (ip:port)
# protocol: 'http', 'https', or null (for non-HTTP)
# tags: List of nuclei template tags to use
# timeout_multiplier: Adjust scan timeout (1.0 = default)

service_profiles:
  # --- HTTP Services (require URL format) ---
  # NOTE: Empty tags [] means run ALL templates (comprehensive scan)
  # Nuclei will use -severity filtering only, no tag filtering
  http:
    target_format: url
    protocol: http
    tags: []  # Comprehensive - all templates

  https:
    target_format: url
    protocol: https
    tags: []  # Comprehensive - all templates

  http-proxy:
    target_format: url
    protocol: http
    tags: []  # Comprehensive - all templates

  http-alt:
    target_format: url
    protocol: http
    tags: []  # Comprehensive - all templates

  # MiniServ is Webmin's HTTP server - requires HTTPS for CVE detection
  # NOTE: Use lowercase 'miniserv' to match Nmap service detection output
  miniserv:
    target_format: url
    protocol: https
    tags: [webmin, cve, panel, default-login]
    timeout_multiplier: 1.5

  ssl/http:
    target_format: url
    protocol: https
    tags: []  # Comprehensive - all templates

  # --- Network Services (use host:port format) ---
  # Use service-specific tags only (no 'network' tag) for faster scans

  ssh:
    target_format: host_port
    tags: [ssh]
    timeout_multiplier: 1.0

  ftp:
    target_format: host_port
    tags: [ftp]
    timeout_multiplier: 1.0

  mysql:
    target_format: host_port
    tags: [mysql]
    timeout_multiplier: 1.0
    rate_limit: 50  # Slower for databases

  postgresql:
    target_format: host_port
    tags: [postgres]
    timeout_multiplier: 1.0
    rate_limit: 50  # Slower for databases

  redis:
    target_format: host_port
    tags: [redis]
    timeout_multiplier: 1.0
    rate_limit: 50  # Slower for databases

  mongodb:
    target_format: host_port
    tags: [mongodb]
    timeout_multiplier: 1.0
    rate_limit: 50  # Slower for databases

  memcached:
    target_format: host_port
    tags: [memcached]
    timeout_multiplier: 1.0
    rate_limit: 50  # Slower for caching services

  smtp:
    target_format: host_port
    tags: [smtp]
    timeout_multiplier: 1.0

  rdp:
    target_format: host_port
    tags: [rdp]
    timeout_multiplier: 1.0

  ms-wbt-server:  # RDP alternate name
    target_format: host_port
    tags: [rdp]
    timeout_multiplier: 1.0

  vnc:
    target_format: host_port
    tags: [vnc]
    timeout_multiplier: 1.0

  telnet:
    target_format: host_port
    tags: [telnet]
    timeout_multiplier: 1.0

  ldap:
    target_format: host_port
    tags: [ldap]
    timeout_multiplier: 1.0
    rate_limit: 50  # Slower for sensitive services

  dns:
    target_format: host_port
    tags: [dns]
    timeout_multiplier: 1.0

  domain:  # DNS alternate name
    target_format: host_port
    tags: [dns]
    timeout_multiplier: 1.0

  # --- SMB / Windows Services ---
  # microsoft-ds is Nmap's name for SMB over port 445
  microsoft-ds:
    target_format: host_port
    tags: [smb, windows, cve, samba]
    timeout_multiplier: 1.0

  netbios-ssn:  # NetBIOS Session Service (port 139)
    target_format: host_port
    tags: [smb, windows, netbios, samba]
    timeout_multiplier: 1.0

  # --- Java / Application Servers ---
  # AJP (Apache JServ Protocol) - used by Tomcat
  ajp13:
    target_format: host_port
    tags: [tomcat, ajp, cve, java]
    timeout_multiplier: 1.0

  # Elasticsearch
  elasticsearch:
    target_format: url
    protocol: http
    tags: [elasticsearch, cve, database]
    timeout_multiplier: 1.0

  # --- IoT / Embedded Protocols ---
  upnp:
    target_format: host_port
    tags: [upnp, iot]
    timeout_multiplier: 1.0

  rtsp:
    target_format: host_port
    tags: [rtsp]
    timeout_multiplier: 1.0

  sip:
    target_format: host_port
    tags: [sip, voip]
    timeout_multiplier: 1.0

  mqtt:
    target_format: host_port
    tags: [mqtt, iot]
    timeout_multiplier: 1.0

  coap:
    target_format: host_port
    tags: [coap, iot]
    timeout_multiplier: 1.0

  modbus:
    target_format: host_port
    tags: [modbus, iot, ics]
    timeout_multiplier: 1.0

  bacnet:
    target_format: host_port
    tags: [bacnet, iot, ics]
    timeout_multiplier: 1.0

# ============================================
# Fallback for Unknown Services
# ============================================
# If a service isn't listed above, the mapper will:
# 1. Try using service_name as a nuclei tag
# 2. Use host:port format
# Set to false to skip unknown services entirely
scan_unknown_services: true

